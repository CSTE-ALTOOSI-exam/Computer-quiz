const L=document.getElementById("list"),S=document.getElementById("sc");let f=0,ok=0,ans=0;
const sh=a=>{a=a.map((t,i)=>({t,c:i==0}));for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function build(){L.innerHTML="";ok=ans=0;upd();D.forEach((d,n)=>{if(f&&d[0]!=f)return;
const q=document.createElement("div");q.className="q";q.innerHTML='<small>المحاضرة '+d[0]+' – سؤال '+(n+1)+'</small><h3></h3><div class="ar"><b>الترجمة:</b> '+d[3]+'</div>';
q.querySelector("h3").textContent=d[1];
sh(d[2]).forEach(o=>{const b=document.createElement("button");b.className="o";b.textContent=o.t;b.onclick=()=>{if(q.classList.contains("done"))return;q.classList.add("done");ans++;
if(o.c){ok++;b.classList.add("ok")}else{b.classList.add("no");[...q.querySelectorAll(".o")].forEach(x=>{if(x.dataset.c)x.classList.add("ok")})}upd()};
if(o.c)b.dataset.c=1;q.insertBefore(b,q.querySelector(".ar"))});L.appendChild(q)})}
function upd(){S.textContent="النتيجة: "+ok+" / "+ans}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("on"));b.classList.add("on");f=+b.dataset.f;build()});
document.getElementById("rs").onclick=build;build();
</script></body></html>
